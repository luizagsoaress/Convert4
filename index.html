<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="imagens/logo.png" type="image/png">
    <title>Conversor de bases</title>
</head>
<body>
    <div class="container-fluid p-0">
        <nav class="navbar nav w-100">
            <div class="logo-div">
                <div class="logo-wrapper">
                    <img src="imagens/logo.png" alt="logo-img" class="logo-img" draggable="false">
                    <div class="logo">
                        <span class="nome-logo">Convert4</span>
                    </div>
                </div>
            </div>  
            <div class="acesso-wrapper">
                <a href="https://github.com/luizagsoaress" class="github-btn nav-link" draggable="false">Github</a> 
            </div>
        </nav>
        <div class="conteudo-container">
            <div class="input-container">
                <div class="info-div">
                    <span class="sobre-texto">
                        <i class="fa-solid fa-circle-info info-icon me-1"></i>
                        Os sistemas numéricos de programação comuns incluem binário (base 2), decimal (base 10), octal (base 8) e hexadecimal (base 16). Essa ferramenta de conversão de sistemas numéricos permite que o usuário insira um número em qualquer sistema e converta-o para os outros.
                    </span>
                </div>

                <div class="def-div">
                    <label for="input-decimal">Decimal</label>
                    <input type="text" class="input-decimal" placeholder="Digite o valor decimal" data-base="decimal">
                </div>

                <div class="def-div">
                    <label for="input-octal">Octal</label>
                    <input type="text" class="input-octal" placeholder="Digite o valor octal" data-base="octal">
                </div>

                <div class="def-div">
                    <label for="input-hexadecimal">Hexadecimal</label>
                    <input type="text" class="input-hexadecimal" placeholder="Digite o valor Hexadecimal" data-base="hexadecimal">
                </div>
                
                <div class="def-div">
                    <label for="input-binario">Binário</label>
                    <input type="text" class="input-binario" placeholder="Digite o valor binário" data-base="binario">
                </div>
            </div>
            <div class="tabela-container">
                <img src="imagens/tabela.jpg" alt="tabela-img" class="tabela-img" draggable="false">
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
